name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep tests in the package
        run: sed -i '/^ignore:/,$d' .pkgmeta

      - name: Package with Libs
        uses: BigWigsMods/packager@v2
        with:
          args: -d -z

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run tests
        run: |
          cd .release/DeltaChess
          lua5.1 Libs/LibUnitWow/run.lua --no-toc

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
          else
            VERSION=${GITHUB_SHA:0:7}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Update version in .toc file
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Update the Version line in DeltaChess.toc (use | delimiter so / in refs/heads/... doesn't break sed)
          sed -i "s|^## Version:.*|## Version: $VERSION|" DeltaChess.toc

      - name: Create Package (untagged)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: BigWigsMods/packager@master

      - name: Prepare artifact (unzip packager output)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          unzip -q ".release/DeltaChess-${{ steps.version.outputs.VERSION }}.zip" -d addon-artifact
          # Packager zip has DeltaChess/ at top level; upload that so artifact unzip gives the addon folder
          mv addon-artifact/DeltaChess "DeltaChess-${{ steps.version.outputs.VERSION }}"

      - name: Upload package artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: DeltaChess-${{ steps.version.outputs.VERSION }}
          path: DeltaChess-${{ steps.version.outputs.VERSION }}

      - name: Create Package (release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}